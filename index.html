<!-- === АУДИО И ВИДЕО (ВСТРОЕННЫЕ ПЛЕЕРЫ) === -->
<section style="background: var(--gray-100); padding: 4rem 2rem;">
    <div class="container">
        <div class="section-header">
            <div class="section-label">Материалы</div>
            <h2 class="section-title">Аудио и Видео</h2>
            <p class="section-subtitle">Прослушайте краткий гайд или посмотрите видео-разбор ключевых требований</p>
        </div>
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 2.5rem; max-width: 1000px; margin: 0 auto;">
            <!-- АУДИО ПЛЕЕР -->
            <div style="background: var(--white); border-radius: var(--radius-lg); padding: 2rem; border: 1px solid var(--gray-300); box-shadow: var(--shadow-md);">
                <div style="text-align: center; margin-bottom: 1.5rem;">
                    <div style="width: 80px; height: 80px; background: var(--primary-light); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 2.5rem; margin: 0 auto 1rem;">🎧</div>
                    <h3 style="font-size: 1.3rem; font-weight: 700; color: var(--dark); margin-bottom: 0.5rem;">Аудио-гайд</h3>
                    <p style="font-size: 0.9rem; color: var(--gray-500); line-height: 1.6;">Краткий обзор ключевых пунктов приказа ФСТЭК-117</p>
                </div>
                <div style="background: var(--gray-100); border-radius: 12px; overflow: hidden; border: 1px solid var(--gray-300);">
                    <iframe src="https://drive.google.com/file/d/1Z_YJZHV9Vq82x9pbHnhzuzEnHMpIebM4/preview" 
                            style="width: 100%; height: 120px; border: none;" 
                            allow="autoplay"
                            loading="lazy">
                    </iframe>
                </div>
            </div>
            
            <!-- ВИДЕО ПЛЕЕР -->
            <div style="background: var(--white); border-radius: var(--radius-lg); padding: 2rem; border: 1px solid var(--gray-300); box-shadow: var(--shadow-md);">
                <div style="text-align: center; margin-bottom: 1.5rem;">
                    <div style="width: 80px; height: 80px; background: var(--accent-light); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 2.5rem; margin: 0 auto 1rem;">🎬</div>
                    <h3 style="font-size: 1.3rem; font-weight: 700; color: var(--dark); margin-bottom: 0.5rem;">Видео-презентация</h3>
                    <p style="font-size: 0.9rem; color: var(--gray-500); line-height: 1.6;">Визуализация процесса перевода регуляторики</p>
                </div>
                <div style="background: var(--gray-100); border-radius: 12px; overflow: hidden; border: 1px solid var(--gray-300);">
                    <div style="position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden;">
                        <iframe src="https://drive.google.com/file/d/1-ugnWhTSlH9JH7kHNXY4U_f_m2mdd-WI/preview" 
                                style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none;" 
                                allow="autoplay"
                                loading="lazy">
                        </iframe>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
<!-- === КОНЕЦ БЛОКА АУДИО И ВИДЕО === -->
